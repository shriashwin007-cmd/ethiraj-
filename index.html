<script>
    // 1. CURSOR MOTION
    const cur = document.getElementById('cur');
    const ring = document.getElementById('cur-ring');
    document.addEventListener('mousemove', (e) => {
        gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0 });
        gsap.to(ring, { x: e.clientX - 14, y: e.clientY - 14, duration: 0.15 });
    });

    // 2. THE FIX: SMOOTH SCROLL FOR "ENTER UNIVERSE"
    document.querySelector('.btn').addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector('#stats');
        target.scrollIntoView({ behavior: 'smooth' });
        
        // Bonus: Flash the ring when clicking
        gsap.to(ring, { scale: 2, opacity: 0, duration: 0.5, onComplete: () => {
            gsap.set(ring, { scale: 1, opacity: 1 });
        }});
    });

    // 3. UNIVERSE CANVAS ANIMATION
    const canvas = document.getElementById('universe-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5;
            this.speed = Math.random() * 0.3;
            this.alpha = Math.random();
        }
        draw() {
            ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        update() {
            this.y -= this.speed;
            if (this.y < 0) this.y = canvas.height;
            this.alpha += 0.01;
            if (this.alpha > 1) this.alpha = 0;
        }
    }

    for(let i=0; i<150; i++) stars.push(new Star());

    function animateUniverse() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animateUniverse);
    }
    animateUniverse();

    // 4. GSAP ENTRANCE & STAT COUNTER
    gsap.registerPlugin(ScrollTrigger);

    gsap.from(".hero-h1", { opacity: 0, y: 100, duration: 1.5, ease: "power4.out" });
    
    // This makes the numbers "jump" when you scroll down
    gsap.from(".stat-box", {
        scrollTrigger: {
            trigger: "#stats",
            start: "top 80%",
        },
        y: 50, 
        opacity: 0, 
        stagger: 0.2, 
        duration: 1, 
        ease: "back.out(1.7)"
    });

    // Numerical counter effect for the demo
    const items = document.querySelectorAll(".stat-num");
    items.forEach((item) => {
        let endValue = parseInt(item.innerText);
        if (isNaN(endValue)) return; // Skip "A++"
        gsap.fromTo(item, { innerText: 0 }, {
            innerText: endValue,
            duration: 2,
            scrollTrigger: item,
            snap: { innerText: 1 },
            ease: "power1.inOut"
        });
    });
</script>
