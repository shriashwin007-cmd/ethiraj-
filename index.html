<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ethiraj College | Digital Universe Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Space+Grotesk:wght@300;500;700&family=DM+Mono&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        /* Inserted your CSS system here - simplified for the "Cook" */
        :root {
            --red: #8B0000; --gold: #FFD700; --void: #030205; --ink: #F0EAE0;
        }
        body { background: var(--void); color: var(--ink); font-family: 'Space Grotesk', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* THE COOK: Custom Scrollbar & Cursor */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--red); }

        /* AUTHENTIC CURSOR */
        #cur {
            position: fixed; width: 10px; height: 10px; background: var(--gold);
            border-radius: 50%; pointer-events: none; z-index: 10000; mix-blend-mode: difference;
        }

        /* HERO STYLING */
        #hero {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; position: relative; overflow: hidden;
        }
        .hero-title {
            font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 8rem);
            line-height: 0.9; z-index: 10;
        }
        .hero-title span { color: var(--red); -webkit-text-stroke: 1px var(--gold); }
        
        canvas#stars { position: absolute; top: 0; left: 0; opacity: 0.6; }

        /* BUTTONS */
        .btn-main {
            padding: 1rem 2.5rem; border: 1px solid var(--gold); color: var(--gold);
            text-transform: uppercase; letter-spacing: 2px; text-decoration: none;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .btn-main:hover { background: var(--red); color: white; border-color: var(--red); }

        /* ADDED SECTIONS */
        .section-padding { padding: 100px 5%; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { border: 1px solid rgba(255,215,0,0.1); padding: 40px; text-align: center; }
        .stat-card h2 { font-size: 3rem; color: var(--gold); margin: 0; }
    </style>
</head>
<body>

    <div id="cur"></div>

    <section id="hero">
        <canvas id="stars"></canvas>
        <div class="hero-content">
            <p style="letter-spacing: 5px; color: var(--gold); margin-bottom: 20px;">ESTD 1948</p>
            <h1 class="hero-title">ETHIRAJ<br><span>COLLEGE</span></h1>
            <p style="margin: 30px 0; opacity: 0.7;">Empowering Women. Enriching Lives. Engineering Futures.</p>
            <a href="#" class="btn-main">Enter Universe</a>
        </div>
    </section>

    <section class="section-padding">
        <div class="grid-stats">
            <div class="stat-card"><h2>75+</h2><p>Years of Excellence</p></div>
            <div class="stat-card"><h2>30k+</h2><p>Alumni Network</p></div>
            <div class="stat-card"><h2>A++</h2><p>NAAC Accreditation</p></div>
            <div class="stat-card"><h2>1st</h2><p>In Arts & Science</p></div>
        </div>
    </section>

    <footer style="padding: 50px; border-top: 1px solid var(--gold); text-align: center; opacity: 0.5;">
        <p>© 2026 Ethiraj College for Women | Chennai, India</p>
    </footer>

    <script>
        // CURSOR LOGIC
        const cursor = document.querySelector('#cur');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // HERO STARS ANIMATION (THE "UNIVERSE" FEEL)
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = Array.from({ length: 200 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 0.5
        }));

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#FFD700";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.y -= s.speed;
                if (s.y < 0) s.y = canvas.height;
            });
            requestAnimationFrame(draw);
        }
        draw();

        // SCROLL REVEALS
        gsap.registerPlugin(ScrollTrigger);
        gsap.from(".stat-card", {
            scrollTrigger: ".grid-stats",
            y: 50, opacity: 0, stagger: 0.2, duration: 1
        });
    </script>
</body>
</html>
